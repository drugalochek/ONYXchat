<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>

<style>
@font-face{font-family:'Widock';src:url('Widock TRIAL Bold.otf') format('opentype');font-weight:400 800;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-synthesis:weight style}
:root{--bg:#0a0a12;--bg2:#0f0f1a;--card:#16161f;--card2:#1e1e2a;--border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.14);--txt:#f5f5f8;--dim:#82829a;--accent:#8b5cf6;--accent2:#ec4899;--accent3:#06b6d4;--soft:rgba(139,92,246,.16);--danger:#f43f5e;--ok:#10b981;--nav-h:96px}
[data-theme="light"]{--bg:#f5f4fb;--bg2:#fff;--card:#fff;--card2:#f1eff9;--border:rgba(15,23,42,.07);--border-hi:rgba(15,23,42,.14);--txt:#0d0d1a;--dim:#6b6b82;--accent:#7c3aed;--accent2:#db2777;--soft:rgba(124,58,237,.12)}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:'Widock',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));letter-spacing:-.01em}
body.mini-visible{padding-bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom))}
[data-theme="dark"] body{background:radial-gradient(ellipse 60% 40% at 10% 0%,rgba(139,92,246,.14),transparent 55%),radial-gradient(ellipse 50% 40% at 100% 30%,rgba(6,182,212,.09),transparent 55%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none}
*{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.35) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:rgba(139,92,246,.35);border-radius:3px}
.hrow::-webkit-scrollbar,.filter-row::-webkit-scrollbar{display:none}
.topbar{position:sticky;top:0;z-index:40;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,var(--bg) 70%,transparent);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -5px rgba(139,92,246,.6)}

.ibtn .nbadge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--bg)}

main{padding:0 16px calc(60px + env(safe-area-inset-bottom))}

.genre-c{flex-shrink:0;width:170px;height:100px;border-radius:12px;scroll-snap-align:start;cursor:pointer;padding:14px 16px;display:flex;align-items:flex-end;position:relative;overflow:hidden;transition:.15s;box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
.genre-c:active{transform:scale(.97)}
.genre-c .gname{font-size:17px;font-weight:700;line-height:1.15;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2;position:relative;text-transform:none}

.pct-cov{width:200px;height:200px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:10px;box-shadow:0 14px 32px -14px rgba(0,0,0,.8);background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.pct-cov img{width:100%;height:100%;object-fit:cover;display:block}
.pct-cov .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff}
.pct-cov::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#8b5cf6,#a855f7,#c084fc);z-index:3}
.pct-100{position:absolute;left:12px;bottom:12px;font-size:25px;font-weight:900;color:#fff;letter-spacing:-.04em;text-shadow:0 2px 10px rgba(0,0,0,.75);z-index:4}

.track-acts{display:flex;align-items:center;gap:0}
.tfav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:.15s}

.badge-artist,.badge-lyrics,.artist-badge,.verified-pill{display:inline-flex!important;align-items:center!important;gap:3px!important;line-height:1!important;height:auto!important;padding:2px 7px!important;border-radius:9px!important;font-size:9.5px!important;letter-spacing:.02em!important;text-transform:uppercase!important;vertical-align:middle!important;flex-shrink:0!important;width:auto!important;max-width:fit-content!important}
.badge-artist{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff!important}
.badge-lyrics{background:rgba(6,182,212,.2);color:var(--accent3)!important}
.artist-badge{padding:3px 10px!important;border-radius:12px!important;font-size:10px!important;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff!important}

.badge-artist svg,.badge-lyrics svg,.artist-badge svg,.verified-pill svg{width:9px!important;height:9px!important;fill:#fff!important}
.badge-lyrics svg{fill:currentColor!important}
.lrow{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:9px 4px;border-radius:12px;cursor:pointer;transition:.15s}

.lrow-c img{width:100%;height:100%;object-fit:cover;display:block}
.lrow-c svg{width:20px;height:20px}
.lrow-t{font-size:14px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow-m{font-size:11.5px;color:var(--dim)}
.lrow-ch{color:var(--dim);display:flex;align-items:center;gap:6px}
.lrow-ch svg{width:15px;height:15px}
.plc{flex-shrink:0;width:140px;scroll-snap-align:start;cursor:pointer;transition:.15s;position:relative}
.plc:active{transform:scale(.97)}
.plc-cov{width:140px;height:140px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.7);margin-bottom:10px;position:relative}

.plc-cov svg.plc-ico{width:40px;height:40px;opacity:.7}

.plc-m{font-size:11px;color:var(--dim)}
.plc-new .plc-cov{border:1.5px dashed var(--border-hi);background:var(--card)}

.plc-del svg{width:14px;height:14px;pointer-events:none}

.plpage-head{padding:8px 0 22px}
.plpage-cover{width:100%;max-width:260px;height:260px;border-radius:20px;overflow:hidden;margin:0 auto 20px;position:relative;box-shadow:0 24px 50px -20px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;color:#fff}

.plpage-name{font-size:24px;letter-spacing:-.035em;text-align:center;margin-bottom:6px;padding:0 12px;word-break:break-word}

.plpage-icon-btn{width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--border-hi);display:flex;align-items:center;justify-content:center;color:var(--txt)}

.plpage-del{justify-self:end;width:50px;height:50px;border-radius:50%;background:transparent;border:1px solid var(--border-hi);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.plpage-del svg{width:20px;height:20px}
.plpage-tracks{margin-top:14px}
.plpage-cover.liked{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.plpage-cover .liked-heart{width:110px;height:110px;color:#fff}
.plpage-cover.mix-cover{background:linear-gradient(135deg,#8b5cf6,#06b6d4)}
.plpage-cover.mix-cover.mix-cover-day{background:linear-gradient(135deg,#f59e0b,#ec4899)}
.plpage-cover.mix-cover.mix-cover-week{background:linear-gradient(135deg,#06b6d4,#8b5cf6)}
.plpage-cover.mix-cover.mix-cover-genre{background:linear-gradient(135deg,#10b981,#06b6d4)}
.plpage-cover.mix-cover.mix-cover-foryou{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.plpage-cover.mix-cover.mix-cover-similar{background:linear-gradient(135deg,#06b6d4,#10b981)}
.plpage-cover.mix-cover.mix-cover-pct{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.plpage-cover.mix-cover.mix-cover-artist{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.plpage-cover.mix-cover.mix-cover-hour{background:linear-gradient(135deg,#f59e0b,#8b5cf6)}
.mix-cover-icon{width:120px;height:120px;color:#fff;display:flex;align-items:center;justify-content:center}
.mix-cover-icon svg{width:100%;height:100%;stroke:currentColor;fill:none}
.mix-cover-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:8px;margin-bottom:6px;background:rgba(139,92,246,.15);color:var(--accent3)}

.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 15px;margin-bottom:20px}

.empty-i svg{width:26px;height:26px}

.mini{position:fixed;left:10px;right:10px;bottom:calc(var(--nav-h) + 6px + env(safe-area-inset-bottom));z-index:80;border-radius:14px;padding:7px 10px 7px 7px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;box-shadow:0 18px 36px -18px rgba(0,0,0,.9);transform:translateY(calc(100% + var(--nav-h) + 40px + env(safe-area-inset-bottom))) scale(.9);transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .25s;color:#fff;overflow:hidden;background:linear-gradient(135deg,#8b5cf6,#ec4899);cursor:pointer;touch-action:pan-x;opacity:0;visibility:hidden;pointer-events:none}

}

function homogenize(s){
  if (!s) return '';
  return String(s).toLowerCase().trim().replace(/ё/g,'е')
    .replace(/a/g,'а').replace(/e/g,'е').replace(/o/g,'о').replace(/p/g,'р').replace(/c/g,'с')
    .replace(/y/g,'у').replace(/x/g,'х').replace(/k/g,'к').replace(/b/g,'в').replace(/m/g,'м').replace(/t/g,'т').replace(/h/g,'н')
    .replace(/[_\-\s]+/g,' ').replace(/\s+/g,' ').trim();
}

const GENRE_INDEX = (() => {
  const out = [];
  for (const canon in GENRE_ALIASES) for (const a of GENRE_ALIASES[canon]) {
    const key = homogenize(a);
    if (key) out.push([key, canon]);
  }
  out.sort((a, b) => b[0].length - a[0].length);
  return out;
})();

function normalizeGenreSingle(raw){
  if (!raw) return '';
  const s = homogenize(raw);
  for (const [alias, canon] of GENRE_INDEX) if (s === alias) return canon;
  for (const [alias, canon] of GENRE_INDEX) if (s.includes(alias)) return canon;
  return '';
}

function normalizeGenres(raw){
  if (!raw) return [];
  const parts = String(raw).split(/[,;\/&]+/).map(x=>x.trim()).filter(Boolean);

  for (const p of parts){
    const c = normalizeGenreSingle(p);
    if (c) set.add(c);
  }
  return [...set];
}

function seededRandom(seed){ let h = 2166136261; const s = String(seed); for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)/4294967296); }; }
function shuffleWithSeed(arr, seed){ const rnd = seededRandom(seed); const a = [...arr]; for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function getFavoritePool(){ const s = new Set(favArtists); const seen = new Set(); const p = []; tracks.forEach(t2=>{ if (favIds.includes(t2.id) || s.has(t2.artist)){ if (!seen.has(t2.id)){ seen.add(t2.id); p.push(t2); } } }); return p; }
function getFavoriteArtists(){ const set = new Set(favArtists); tracks.forEach(t2 => { if (favIds.includes(t2.id)) set.add(t2.artist); }); return [...set].filter(Boolean); }

function generateMixes(){
  const pool = getFavoritePool();
  if (pool.length < 3) return [];
  const now = new Date();
  const mixes = [];
  const dayKey = now.toISOString().slice(0,10);
  const weekKey = now.getFullYear() + '_' + Math.floor((now - new Date(now.getFullYear(),0,1)) / 604800000);

  const dayTracks = shuffleWithSeed(pool, 'day_' + dayKey).slice(0, 30);
  mixes.push({ id:'__mix_day__', name:t('mix_day'), tag:t('tag_today'), sub: [...new Set(dayTracks.map(t2=>t2.artist))].slice(0,3).join(', '), tracks:dayTracks, icon:'sun', cls:'mix-cover-day' });

  const weekTracks = shuffleWithSeed(pool, 'week_' + weekKey).slice(0, 50);
  mixes.push({ id:'__mix_week__', name:t('mix_week'), tag:t('tag_week'), sub:t('updates_monday'), tracks:weekTracks, icon:'calendar', cls:'mix-cover-week' });

  // «Для вас» — персональная смесь из любимых треков и всех треков любимых исполнителей.
  const byArtist = [];
  const seen = new Set();
  pool.forEach(t2=>{ if (!seen.has(t2.id)){ seen.add(t2.id); byArtist.push(t2); } });
  getFavoriteArtists().forEach(name=>{
    tracks.filter(t2=>t2.artist===name).forEach(t2=>{ if (!seen.has(t2.id)){ seen.add(t2.id); byArtist.push(t2); } });
  });
  const forYou = shuffleWithSeed(byArtist, 'foryou_' + dayKey).slice(0, 50);
  if (forYou.length >= 3) mixes.push({ id:'__mix_foryou__', name:t('mix_foryou'), tag:t('tag_foryou'), sub:t('from_liked'), tracks:forYou, icon:'music', cls:'mix-cover-foryou' });
  return mixes;
}

// Обновляется каждый час
function generateGenreOfHour(){
  const pool = getFavoritePool();
  if (!pool.length) return null;
  const genres = new Set();
  pool.forEach(t2 => normalizeGenres(t2.genre).forEach(g => genres.add(g)));
  const arr = [...genres];
  if (!arr.length) return null;
  const hourSeed = 'hour_' + Math.floor(Date.now() / 3600000);
  const rnd = seededRandom(hourSeed);
  const pick = arr[Math.floor(rnd() * arr.length)];
  const list = tracks.filter(t2 => normalizeGenres(t2.genre).includes(pick));
  if (list.length < 3) return null;
  return { id: '__hour_genre__', name: genreName(pick), tag: t('tag_hour'), sub: tn(list.length), tracks: shuffleWithSeed(list, hourSeed), icon: 'clock', cls: 'mix-cover-hour' };
}

function generateDailyMixes(){
  const pool = getFavoritePool(); if (pool.length < 3) return [];
  const shuffled = shuffleWithSeed(pool, 'daily_' + new Date().toISOString().slice(0,10));
  const mixes = []; const per = Math.max(6, Math.ceil(shuffled.length/3));
  for (let i=0;i<3;i++){ const slice = shuffled.slice(i*per, (i+1)*per); if (slice.length < 3) break; const artists = [...new Set(slice.map(t2=>t2.artist))].slice(0,3); mixes.push({ id:'__daily_'+i+'__', name: t('daily_mix')+' '+(i+1), tag:'Daily', sub: artists.join(', '), tracks: slice, icon:'star', cls:'mix-cover-foryou' }); }
  return mixes;
}

function generateArtistMixes(){
  const favArtistsList = getFavoriteArtists();
  if (!favArtistsList.length) return [];
  const out = [];
  favArtistsList.slice(0, 8).forEach(name => {
    const ts = tracks.filter(t2=>t2.artist === name);
    if (ts.length < 2) return;
    out.push({ id:'__artist_' + encodeURIComponent(name), name: name, tag:t('artist_mix_tag'), sub: tn(ts.length), tracks: shuffleWithSeed(ts, 'artist_'+name), icon:'person', cls:'mix-cover-artist' });
  });
  return out;
}

function generateSinceYouLike(){
  const favArtistsList = getFavoriteArtists();
  if (!favArtistsList.length) return null;
  const seed = 'since_' + new Date().toISOString().slice(0,10);
  const rnd = seededRandom(seed);
  const pick = favArtistsList[Math.floor(rnd()*favArtistsList.length)];
  const base = tracks.filter(t2=>t2.artist === pick);
  if (!base.length) return null;
  const genres = new Set();
  base.forEach(t2 => normalizeGenres(t2.genre).forEach(g => genres.add(g)));
  if (!genres.size) return null;
  const counts = {};
  tracks.forEach(t2=>{
    if (t2.artist === pick) return;
    const gs = normalizeGenres(t2.genre);
    if (gs.some(g => genres.has(g))) counts[t2.artist] = (counts[t2.artist]||0) + 1;
  });
  const similar = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  if (!similar.length) return null;
  return { artist: pick, similar: similar.map(name => { const ts = tracks.filter(t2=>t2.artist === name); return { name, cover: ts.find(t2=>t2.cover)?ts.find(t2=>t2.cover).cover:null, count: ts.length }; }) };
}



function generatePct(){
  const counts = {};
  tracks.forEach(t2=>{ if (favIds.includes(t2.id) && t2.artist) counts[t2.artist] = (counts[t2.artist]||0)+1; });
  if (!Object.keys(counts).length && favArtists.length){ favArtists.forEach(a => { if (a) counts[a] = 1; }); }
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  return top.map(name => ({ name, tracks: tracks.filter(t2=>t2.artist === name) })).filter(x=>x.tracks.length >= 1);
}

function buildMixCard(mix){
  const card = document.createElement('div'); card.className = 'mix';
  const picks = mix.tracks.slice(0, 4);
  const cells = picks.map(t2 => `<div>${t2.cover ? `<img src="${t2.cover}" alt="">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`}</div>`).join('');
  const filled = cells + Array(Math.max(0, 4-picks.length)).fill(`<div class="placeholder"></div>`).join('');
  card.innerHTML = `<div class="mix-cov">${filled}<div class="mix-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div><div class="mix-t">${esc(mix.name)}</div><div class="mix-d">${esc(mix.sub)}</div>`;
  card.addEventListener('click', ()=>openMix(mix.id));
  return card;
}

function getHourCountdown(){
  const now = new Date();
  const next = new Date(now);
  next.setMinutes(60,0,0);
  const ms = Math.max(0, next.getTime()-Date.now());
  const total = Math.floor(ms/1000);
  return String(Math.floor(total/3600)).padStart(2,'0')+':'+String(Math.floor((total%3600)/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function updateHourCountdown(){
  const el = $('hour-sub'); if (!el) return;
  if (!$('shead-hour') || $('shead-hour').style.display === 'none') return;
  el.innerHTML = `${esc(t('hour_sub'))}<span class="hour-countdown">· ${getHourCountdown()}</span>`;
}
function startHourTimer(){
  if (hourTimerId) clearInterval(hourTimerId);
  hourTimerId = setInterval(()=>{
    const left = getHourCountdown();
    updateHourCountdown();
    if (left === '00:00:00') renderHome();
  },1000);
}

function renderSearchBody(q){
  const box = $('searchBody'); q = (q||'').trim().toLowerCase(); box.innerHTML = '';

  const qCanons = normalizeGenres(q);
  const trFound = tracks.filter(t2 => t2.title.toLowerCase().includes(q) || t2.artist.toLowerCase().includes(q) || (t2.album||'').toLowerCase().includes(q) || (qCanons.length && normalizeGenres(t2.genre).some(g => qCanons.includes(g))));

async function loginWithGoogle(){
  const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
  const btn = $('authGoogle'); btn.disabled = true;
  try { const result = await signInWithPopup(auth, provider); try { await update(ref(db, 'users/'+result.user.uid), { email: result.user.email || null, photoURL: result.user.photoURL || null }); } catch(e){} $('authModal').classList.remove('show'); $('welcomeModal').classList.remove('show'); renderProfile(); renderAll(); }
  catch(e){ console.error(e); toast((e.code||e.message),'err'); }

}
async function loginWithEmail(){
  const email = $('authEmail').value.trim(); const password = $('authPassword').value;
  if (!email || !email.includes('@')){ toast('Email','err'); return; }
  if (!password || password.length < 6){ toast('6+','err'); return; }
  if (!captchaSolved){ toast(t('captcha'),'err'); return; }
  const btn = $('authSubmit'); btn.disabled = true; const old = btn.textContent; btn.textContent = '...';
  try {
    let cred;
    if (authEmailMode === 'register') cred = await createUserWithEmailAndPassword(auth, email, password);
    else cred = await signInWithEmailAndPassword(auth, email, password);
    try { await update(ref(db, 'users/'+cred.user.uid), { email: cred.user.email || null }); } catch(e){}
    $('authModal').classList.remove('show'); $('welcomeModal').classList.remove('show');
    renderProfile(); renderAll();
  } catch(e){ const map = { 'auth/email-already-in-use':'Email уже используется', 'auth/invalid-email':'Некорректный email', 'auth/weak-password':'Пароль слишком простой', 'auth/wrong-password':'Неверный пароль', 'auth/user-not-found':'Пользователь не найден', 'auth/invalid-credential':'Неверный email или пароль' }; toast(map[e.code] || ('Ошибка: ' + (e.code || e.message)),'err'); }
  finally { btn.disabled = false; btn.textContent = old; }
}

$('editCoverPick').addEventListener('click', ()=>$('coverInput').click());
$('coverInput').addEventListener('change', async e=>{ const f = e.target.files[0]; e.target.value = ''; if (!f) return; const d = await processCover(f); if (!d) return; editCoverNew = d; $('editCoverPrev').innerHTML = `<img src="${d}" alt="">`; });
$('editSave').addEventListener('click', async ()=>{ if (!editId) return; const t2 = getTrack(editId); if (!t2) return; const upd = { title: $('editTitle').value.trim() || t2.title, artist: $('editArtist').value.trim() || '—', album: $('editAlbum').value.trim(), lyrics: $('editLyrics').value.trim() }; if (editCoverNew !== undefined) upd.cover = editCoverNew; try { await update(ref(db, 'tracks/'+t2.id), upd); } catch(e){ return; } closeEdit(); if ($('lyricsModal').classList.contains('show')) renderLyricsModal(); renderAll(); });

let plColor = PALETTE[0];
function openPlModal(){ $('plName').value = ''; plColor = PALETTE[playlists.length % PALETTE.length]; newPlCoverNew = undefined; $('newPlCoverPrev').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`; const cp = $('plColors'); cp.innerHTML = ''; PALETTE.forEach(c=>{ const d = document.createElement('button'); d.className = 'cdot' + (c === plColor ? ' active' : ''); d.style.background = `linear-gradient(135deg, ${c}, ${shade(c,-30)})`; d.addEventListener('click', ()=>{ plColor = c; cp.querySelectorAll('.cdot').forEach(x=>x.classList.toggle('active', x === d)); }); cp.appendChild(d); }); $('plModal').classList.add('show'); setTimeout(()=>$('plName').focus(), 100); }
$('plCancel').addEventListener('click', ()=>$('plModal').classList.remove('show'));
$('plModal').addEventListener('click', e=>{ if (e.target === $('plModal')) e.target.classList.remove('show'); });
$('newPlCoverPick').addEventListener('click', ()=>$('plCoverInput').click());
$('newPlCoverClear').addEventListener('click', ()=>{ newPlCoverNew = null; $('newPlCoverPrev').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`; });
$('plCoverInput').addEventListener('change', async e=>{ const f = e.target.files[0]; e.target.value = ''; if (!f) return; const d = await processCover(f, 300); if (!d) return; newPlCoverNew = d; $('newPlCoverPrev').innerHTML = `<img src="${d}" alt="">`; });
$('plOk').addEventListener('click', async ()=>{ const name = $('plName').value.trim(); if (!name) return; if (!firebaseUid){ toast('—','err'); return; } const id = uid(); playlists.unshift({ id, name: name.slice(0,40), color: plColor, trackIds: [], cover: newPlCoverNew || null, createdAt: Date.now() }); await savePlaylistsToFB(); $('plModal').classList.remove('show'); renderAll(); });

$('plSetCancel').addEventListener('click', ()=>$('plSettingsModal').classList.remove('show'));
$('plSettingsModal').addEventListener('click', e=>{ if (e.target === $('plSettingsModal')) e.target.classList.remove('show'); });
$('plSetCoverPick').addEventListener('click', ()=>$('plSetCoverInput').click());
$('plSetCoverClear').addEventListener('click', ()=>{ plSetCoverNew = null; $('plSetCoverPrev').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`; });
$('plSetCoverInput').addEventListener('change', async e=>{ const f = e.target.files[0]; e.target.value = ''; if (!f) return; const d = await processCover(f, 300); if (!d) return; plSetCoverNew = d; $('plSetCoverPrev').innerHTML = `<img src="${d}" alt="">`; });
$('plSetSave').addEventListener('click', async ()=>{ if (!plSetEditId) return; const pl = playlists.find(p=>p.id === plSetEditId); if (!pl) return; const name = $('plSetName').value.trim(); if (name) pl.name = name.slice(0,40); const ac = $('plSetColors').querySelector('.cdot.active'); if (ac){ const bg = ac.style.background; const m = bg.match(/#[0-9a-f]{6}/i); if (m) pl.color = m[0]; } if (plSetCoverNew !== undefined) pl.cover = plSetCoverNew; await savePlaylistsToFB(); $('plSettingsModal').classList.remove('show'); renderAll(); });

$('searchInput').addEventListener('input', ()=>renderSearchBody($('searchInput').value));
$('explore-filters').addEventListener('click', e=>{ const f = e.target.closest('.filter'); if (!f) return; exploreFilter = f.dataset.f; document.querySelectorAll('#explore-filters .filter').forEach(x=>x.classList.toggle('active', x === f)); renderExplore(); });
$('liked-row').addEventListener('click', openLikedPage);
$('liked-artists-row').addEventListener('click', openLikedArtistsPage);
$('artistBack').addEventListener('click', ()=>{ switchView('home'); currentArtist = null; });
$('artist-tabs').addEventListener('click', e=>{ const f = e.target.closest('.filter'); if (!f) return; artistTab = f.dataset.t; document.querySelectorAll('#artist-tabs .filter').forEach(x=>x.classList.toggle('active', x === f)); renderArtist(); });
$('playlistBack').addEventListener('click', ()=>{ currentPlaylistId = null; switchView('fav'); });

function pickFilesForUpload(){ const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'audio/*'; inp.multiple = true; inp.onchange = e=>{ const fs = [...e.target.files].filter(f=>f.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i.test(f.name)); if (fs.length) addFilesToPending(fs); }; inp.click(); }
$('releaseUploadZone').addEventListener('click', pickFilesForUpload);
$('uplCoverInput').addEventListener('change', async e=>{ const f = e.target.files[0]; e.target.value = ''; if (!f || uplCoverEditIndex < 0) return; const item = pendingReleaseFiles[uplCoverEditIndex]; if (!item) return; const d = await processCover(f, 300); if (!d) return; item.cover = d; refreshReleaseFiles(); });
$('releaseCancel').addEventListener('click', ()=>$('uploadReleaseModal').classList.remove('show'));
$('uploadReleaseModal').addEventListener('click', e=>{ if (e.target === $('uploadReleaseModal')) e.target.classList.remove('show'); });
$('releasePublish').addEventListener('click', publishRelease);

$('authCancel').addEventListener('click', ()=>$('authModal').classList.remove('show'));
$('authModal').addEventListener('click', e=>{ if (e.target === $('authModal')) e.target.classList.remove('show'); });
$('authGoogle').addEventListener('click', loginWithGoogle);
$('authEmailToggle').addEventListener('click', ()=>{ const f = $('authEmailForm'); f.style.display = f.style.display === 'none' ? 'block' : 'none'; if (f.style.display === 'block'){ newCaptcha(); } });
$('authSwitchMode').addEventListener('click', ()=>{ authEmailMode = authEmailMode === 'login' ? 'register' : 'login'; $('authTitle').textContent = authEmailMode === 'register' ? t('register') : t('login'); $('authSwitchMode').textContent = authEmailMode === 'register' ? t('login') : t('register'); $('authSubmit').textContent = authEmailMode === 'register' ? t('create') : t('login'); if ($('authEmailForm').style.display === 'block') newCaptcha(); });
$('authSubmit').addEventListener('click', loginWithEmail);
$('authPassword').addEventListener('keydown', e=>{ if (e.key === 'Enter') loginWithEmail(); });

$('welcomeLogin').addEventListener('click', ()=>{ $('welcomeModal').classList.remove('show'); openAuthModal('login'); });
$('welcomeGuest').addEventListener('click', ()=>{ guestMode = true; savePrefs(); $('welcomeModal').classList.remove('show'); renderAll(); });

$('langBtn').addEventListener('click', ()=>{
  const list = $('langList'); const langs = [['ru','Русский','🇷🇺'],['en','English','🇬🇧'],['de','Deutsch','🇩🇪'],['zh','中文','🇨🇳'],['es','Español','🇪🇸'],['fr','Français','🇫🇷']];
  list.innerHTML = '';
  langs.forEach(([code, name, flag])=>{ const b = document.createElement('button'); b.className = 'pref-radio-row'; b.innerHTML = `<input type="radio" name="lng" ${lang===code?'checked':''}><div class="pref-radio"></div><div class="lbl">${flag} ${name}</div>`; b.addEventListener('click', ()=>{ lang = code; list.querySelectorAll('input').forEach(x=>x.checked = false); b.querySelector('input').checked = true; applyLang(); setTimeout(()=>$('langModal').classList.remove('show'), 200); }); list.appendChild(b); });
  $('langModal').classList.add('show');
});
$('langModal').addEventListener('click', e=>{ if (e.target === $('langModal')) e.target.classList.remove('show'); });

document.addEventListener('keydown', e=>{ if (e.target.matches('input, textarea')) return; if (e.code === 'Space'){ e.preventDefault(); $('miniPlay').click(); } if (e.key === 'Escape'){ closeFs(); closeTrackMenu(); closeEdit(); $('lyricsModal').classList.remove('show'); } });

// ============ BOOT ============
async function boot(){
  try { await setPersistence(auth, browserLocalPersistence); } catch(e){}
  lang = detectLang();
  applyTheme();
  startHourTimer();
  $('setId3').checked = settings.id3; $('setCover').checked = settings.cover; $('setFallback').checked = settings.fallback;
  tracks = []; playlists = []; favIds = []; favArtists = [];
  applyLang();
  showLoading('...');
  getRedirectResult(auth).catch(e=>console.error(e));

  // Notifications welcome
  if (!notifications.length) pushNotif('n2', t('notif_welcome'), 'Sonic');

  onAuthStateChanged(auth, user=>{
    if (user){
      firebaseUid = user.uid;
      guestMode = false; savePrefs();
      if (unsubTracks){ unsubTracks(); unsubTracks = null; }
      if (unsubProfile){ unsubProfile(); unsubProfile = null; }
      if (unsubPlaylists){ unsubPlaylists(); unsubPlaylists = null; }
      if (unsubFavorites){ unsubFavorites(); unsubFavorites = null; }
      if (unsubFavArtists){ unsubFavArtists(); unsubFavArtists = null; }
      try { update(ref(db, 'users/'+user.uid), { email: user.email || null }).catch(e=>{}); } catch(e){}
      subscribeUserProfile(); subscribeTracks(); subscribePlaylists(); subscribeFavorites(); subscribeFavArtists();
      setTimeout(hideLoading, 500);
      renderProfile();
      $('welcomeModal').classList.remove('show');
    } else {
      firebaseUid = null;
      if (!guestMode){
        $('welcomeTitle').textContent = t('welcome_title');
        $('welcomeDesc').textContent = t('welcome_desc');
        $('welcomeModal').classList.add('show');
      }
      subscribeTracks();
      setTimeout(hideLoading, 500);
      renderProfile();
    }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
